name: Deploy Firebase Hosting
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/hosting.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGIFLUXOS }}'
      - run: npm install -g firebase-tools@15.32.1
      - name: Deploy Hosting only
        run: firebase deploy --project digifluxos --only hosting --non-interactive
      - name: Verify deployed Hosting
        run: node scripts/verify-deployment.mjs https://digifluxos-agentic.web.app

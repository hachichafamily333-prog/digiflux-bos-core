name: Deploy Firebase Hosting and API
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: npm test --prefix functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGIFLUXOS }}'
      - run: npm install -g firebase-tools@15.32.1
      - name: Deploy API then Hosting
        run: |
          firebase deploy --project digifluxos --only functions:api --non-interactive
          firebase deploy --project digifluxos --only hosting --non-interactive
      - name: Verify deployed Hosting and API
        run: node scripts/verify-deployment.mjs https://digifluxos.web.app

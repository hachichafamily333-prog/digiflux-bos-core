name: Core checks (no public deployment)
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/hosting.test.mjs
      - run: echo "Public application is deployed from hachichafamily333-prog/-digiflux-client-os."
